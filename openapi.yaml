openapi: 3.0.3
info:
  title: ScanWise API
  version: 2.0.0
  description: ScanWise Backend API contract for label scanning, ingredient analysis, and personalized reports.
servers:
  - url: /api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    GuestAuthResponse:
      type: object
      required:
        - access_token
        - role
        - expires_in
      properties:
        access_token:
          type: string
        role:
          type: string
          enum: [guest]
        expires_in:
          type: integer
    OtpRequestPayload:
      type: object
      required:
        - phone_number
      properties:
        phone_number:
          type: string
          example: "+919876543210"
    OtpVerifyPayload:
      type: object
      required:
        - phone_number
        - otp
      properties:
        phone_number:
          type: string
        otp:
          type: string
    TokenResponse:
      type: object
      required:
        - access_token
        - role
      properties:
        access_token:
          type: string
        role:
          type: string
          enum: [user]
        user:
          type: object
          properties:
            user_id:
              type: integer
            phone_number:
              type: string
    UserProfile:
      type: object
      required:
        - age_group
      properties:
        age_group:
          type: string
          enum: [child, teen, adult, old_age]
        conditions:
          type: array
          items:
            type: string
            enum: [diabetes, hypertension, high_cholesterol, heart_disease, kidney_disease]
        allergens:
          type: array
          items:
            type: string
            enum: [peanut, tree_nut, milk, egg, soy, wheat_gluten, fish, shellfish, sesame, mustard, sulphites, fragrance]
        skin_type:
          type: string
          nullable: true
          enum: [normal, dry, oily, combination, sensitive]
        dietary_preference:
          type: string
          nullable: true
          enum: [vegetarian, vegan, eggetarian, non_vegetarian, jain]
    ScanExtractionResponse:
      type: object
      required:
        - scan_id
        - product_name
        - category
        - ingredients
        - confidence
      properties:
        scan_id:
          type: string
        product_name:
          type: string
        category:
          type: string
          enum: [food, drink, skincare, other]
        confidence:
          type: number
        ingredients:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
              category:
                type: string
              original_text:
                type: string
        nutrition:
          type: object
          additionalProperties:
            type: number
    ScanPatchPayload:
      type: object
      properties:
        product_name:
          type: string
        category:
          type: string
        ingredients:
          type: array
          items:
            type: string
    AnalyzeScanPayload:
      type: object
      properties:
        guest_profile:
          $ref: '#/components/schemas/UserProfile'
    ReportItem:
      type: object
      required:
        - ingredient_id
        - name
        - rating
        - severity
      properties:
        ingredient_id:
          type: integer
        name:
          type: string
        rating:
          type: string
          enum: [safe, adjustable, risk]
        severity:
          type: integer
          enum: [1, 2, 3]
        category:
          type: string
        reason:
          type: string
          nullable: true
        uses:
          type: string
          nullable: true
        disadvantages:
          type: string
          nullable: true
    ReportResponse:
      type: object
      required:
        - report_id
        - product_name
        - verdict
        - overall_score
        - ingredients
      properties:
        report_id:
          type: string
        product_name:
          type: string
        product_type:
          type: string
        verdict:
          type: string
          enum: [good, okay, avoid]
        overall_score:
          type: integer
          minimum: 0
          maximum: 100
        summary_reason:
          type: string
        created_at:
          type: string
        guidance:
          type: object
          properties:
            max_servings_per_day:
              type: number
            days_per_week:
              type: integer
            limiting_nutrient:
              type: string
            guidance_basis:
              type: string
              enum: [rule, ai_estimate]
        breakdown:
          type: object
          properties:
            safe_count:
              type: integer
            adjustable_count:
              type: integer
            risk_count:
              type: integer
            categories:
              type: array
              items:
                type: object
                properties:
                  category:
                    type: string
                  count:
                    type: integer
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/ReportItem'

paths:
  /health:
    get:
      summary: Liveness check
      responses:
        '200':
          description: Service healthy
  /auth/guest:
    post:
      summary: Start a guest session
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestAuthResponse'
  /auth/otp/request:
    post:
      summary: Request SMS OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestPayload'
      responses:
        '200':
          description: OTP dispatched
  /auth/otp/verify:
    post:
      summary: Verify OTP and exchange for JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyPayload'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /auth/refresh:
    post:
      summary: Refresh JWT access token from httpOnly cookie
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /auth/logout:
    post:
      summary: Revoke refresh token and log out
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
  /profile:
    get:
      summary: Read user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    put:
      summary: Update user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
  /scans:
    post:
      summary: Upload label image
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanExtractionResponse'
  /scans/{id}:
    patch:
      summary: Correct extracted items
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanPatchPayload'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanExtractionResponse'
  /scans/{id}/analyze:
    post:
      summary: Run deterministic analysis and produce report
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeScanPayload'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
  /reports:
    get:
      summary: Get paginated report history
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportResponse'
                  total:
                    type: integer
  /reports/{id}:
    get:
      summary: Get single report
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
    delete:
      summary: Delete report
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report deleted
  /account:
    delete:
      summary: Delete account and cascade personal data
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account permanently deleted

